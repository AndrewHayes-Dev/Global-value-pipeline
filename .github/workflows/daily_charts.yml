name: Daily Chart Data (Disabled)

on:
  workflow_dispatch:

jobs:
  charts-au:
    name: AU Charts (ASX)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and upload AU chart data
        env:
          MARKET:                      AU
          CLOUDFLARE_ACCOUNT_ID:       ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GLOBAL_R2_ACCESS_KEY_ID:     ${{ secrets.GLOBAL_R2_ACCESS_KEY_ID }}
          GLOBAL_R2_SECRET_ACCESS_KEY: ${{ secrets.GLOBAL_R2_SECRET_ACCESS_KEY }}
          GLOBAL_R2_BUCKET_NAME:       global-investor-data
        run: python pipeline/chart_fetcher.py

  charts-us:
    name: US Charts (NYSE/NASDAQ)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and upload US chart data
        env:
          MARKET:                      US
          CLOUDFLARE_ACCOUNT_ID:       ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GLOBAL_R2_ACCESS_KEY_ID:     ${{ secrets.GLOBAL_R2_ACCESS_KEY_ID }}
          GLOBAL_R2_SECRET_ACCESS_KEY: ${{ secrets.GLOBAL_R2_SECRET_ACCESS_KEY }}
          GLOBAL_R2_BUCKET_NAME:       global-investor-data
        run: python pipeline/chart_fetcher.py
